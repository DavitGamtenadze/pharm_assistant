[project]
name = "pharm-assistant"
version = "0.1.0"
description = "Citation-grounded question answering over medical PDFs"
authors = [
    { name = "Davit Gamtenadze", email = "gamtenadze.david@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "diskcache>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.17",
    "langchain-openai>=1.6.0",
    "langfuse>=4.14.5",
    "mcp>=2.1.1",
    "openai>=3.5.0",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
medical-document-api = "pharm_assistant.main:run"
medical-document-mcp = "pharm_assistant.mcp_server:run"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pharm_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
